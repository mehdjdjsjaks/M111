<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Axcel NLP Real</title>
  <script src="https://unpkg.com/compromise@13.11.3/builds/compromise.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #111;
      padding: 1rem;
      text-align: center;
      font-size: 1.5rem;
      border-bottom: 1px solid #333;
    }
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .message {
      max-width: 80%;
      padding: 0.75rem 1rem;
      border-radius: 10px;
    }
    .user {
      background: #444;
      align-self: flex-end;
    }
    .bot {
      background: #222;
      align-self: flex-start;
    }
    form {
      display: flex;
      padding: 1rem;
      background-color: #111;
      border-top: 1px solid #333;
    }
    input {
      flex: 1;
      padding: 0.75rem;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      background-color: #333;
      color: white;
    }
    button {
      margin-left: 0.5rem;
      padding: 0.75rem 1rem;
      border: none;
      background-color: #00aaff;
      color: white;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>Axcel NLP</header>
  <div class="chat" id="chat"></div>
  <form id="form">
    <input type="text" id="input" placeholder="جمله‌ای بنویس..." required />
    <button type="submit">ارسال</button>
  </form>
  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const chat = document.getElementById('chat');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      input.value = '';
      setTimeout(() => {
        const response = analyzeText(text);
        addMessage(response, 'bot');
      }, 500);
    });

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function analyzeText(text) {
      const doc = nlp(text);
      const nouns = doc.nouns().out('array');
      const verbs = doc.verbs().out('array');
      const isPast = doc.verbs().isPast().out('array').length > 0;
      const tense = isPast ? 'گذشته' : 'حال یا آینده';
      const pronouns = doc.pronouns().out('array');

      if (!nouns.length && !verbs.length) {
        return 'متوجه نشدم. لطفاً جمله‌ی واضح‌تری بنویس.';
      }

      let response = `تشخیص دادم که جمله شما درباره‌ی `;
      if (nouns.length) response += `«${nouns[0]}» `;
      if (verbs.length) response += `و فعلی مثل «${verbs[0]}» دارد `;
      response += `و زمان جمله به نظر می‌رسد ${tense} باشد.`;
      if (pronouns.length) response += ` ضمیر استفاده‌شده: ${pronouns.join(', ')}`;

      return response;
    }
  </script>
</body>
</html>
